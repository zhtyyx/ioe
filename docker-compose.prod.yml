# Docker Compose >= 2.23.1. No source checkout or local build is required.
services:
  web:
    image: ${IOE_IMAGE:-ghcr.io/zhtyyx/ioe:latest}
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - db_volume:/app/db
      - media_volume:/app/media
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
      - backups_volume:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${IOE_BIND_ADDRESS:-0.0.0.0}:${IOE_PORT:-8000}:80"
    volumes:
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/static/inventory/images/logo.svg"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 6

configs:
  nginx_config:
    content: |
      server {
          listen 80;
          server_name _;
          client_max_body_size 20m;
          location /static/ {
              alias /srv/static/;
          }
          location /media/ {
              alias /srv/media/;
              add_header X-Content-Type-Options nosniff;
          }
          location / {
              proxy_pass http://web:8000;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }

volumes:
  db_volume:
  media_volume:
  static_volume:
  logs_volume:
  backups_volume:
