{% extends 'inventory/base.html' %}

{% block title %}查看日志文件 - {{ block.super }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="card-title mb-0">{{ file_name }}</h2>
                    <p class="text-muted mb-0">显示 {{ total_lines }} 行中的最后 {{ lines }} 行</p>
                </div>
                <div>
                    <a href="{% url 'download_log_file' file_name %}" class="btn btn-primary me-2">下载</a>
                    <a href="{% url 'log_list' %}" class="btn btn-outline-secondary">返回日志列表</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <pre class="mb-0" style="white-space: pre-wrap;">{{ content|safe }}</pre>
    </div>
</div>
{% endblock %}
