<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 主体形状 - 圆角矩形 -->
  <rect x="10" y="10" width="180" height="40" rx="6" fill="url(#logoGradient)" />

  <!-- 抽象盒子图形 - 更现代的设计 -->
  <g transform="translate(30, 15)">
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2" rx="2" />
    <rect x="5" y="5" width="10" height="10" fill="#3B82F6" rx="1" />
  </g>

  <!-- IOE 文字 - 更现代的字体 -->
  <text x="65" y="35" font-family="'SF Pro Display', Arial, sans-serif" font-weight="600" font-size="24" fill="#FFFFFF" letter-spacing="1">IOE</text>

  <!-- 装饰线条 -->
  <line x1="65" y1="40" x2="120" y2="40" stroke="#38BDF8" stroke-width="2" />
</svg>
